name: connection
description: A private world for two. Beautiful animated couple chat.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.3.7

  # UI & Animation
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  lottie: ^3.1.3
  cached_network_image: ^3.4.1

  # State & Storage
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Utils
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  record: ^5.1.2
  video_player: ^2.9.2

  # Realtime
  flutter_webrtc: ^0.12.1+

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700